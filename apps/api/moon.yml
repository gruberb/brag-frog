language: 'rust'
tasks:
  build:
    command: 'cargo build --release -p brag-frog'
  lint:
    command: 'cargo clippy -p brag-frog --all-targets -- -D warnings'
  test:
    command: 'cargo test -p brag-frog'
  dev:
    command: 'cargo run -p brag-frog'
    preset: 'server'
  types:
    command: 'cargo test -p brag-frog export_bindings'
  types-check:
    command: 'git diff --exit-code -- ../web/src/types/api'
    deps: ['~:types']
